name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Deploy via SFTP / SSH
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          export sshpass_p="${FTP_PASSWORD}"
          sshpass -p "$FTP_PASSWORD" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22" ./dist/* ${FTP_USERNAME}@${FTP_SERVER}:/domains/mistyrose-hummingbird-755752.hostingersite.com/public_html/
